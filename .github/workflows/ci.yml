name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04
    env:
      DUNE_CACHE: enabled
    # Pin to bash so `${PIPESTATUS[0]}` (a bash-only array) in the Build and
    # Run tests steps is guaranteed — GitHub Actions defaults to bash on Linux
    # in practice, but making it explicit avoids silent breakage if the
    # default ever shifts.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3.6.1
        with:
          ocaml-compiler: '5.4.1'

      # Cache only Dune's relocatable build artifacts: opam switches contain
      # absolute paths and are unsafe to restore across ephemeral runners.
      # The run ID makes saves immutable; the prefix restores only a prior run
      # with the same platform, compiler, dependencies, and job semantics.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ runner.arch }}-ocaml-5.4.1-${{ hashFiles('onton.opam') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            dune-${{ runner.os }}-${{ runner.arch }}-ocaml-5.4.1-${{ hashFiles('onton.opam') }}-${{ github.job }}-

      - name: Use opam.ocaml.org archive cache
        # erratique.ch (upstream for cmdliner, mtime, fpath, logs, uutf, ...)
        # is frequently flaky; the community cache mirrors opam-repository
        # archives behind a CDN, so opam only falls back to upstream on a miss.
        run: opam option 'archive-mirrors=["https://opam.ocaml.org/cache"]'

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      - name: Build
        id: build
        run: |
          opam exec -- dune build 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Annotate build errors
        if: failure() && steps.build.outcome == 'failure'
        run: |
          # Parse OCaml compiler errors into GitHub annotations
          python3 -c "
          import re, sys
          log = open('build.log').read()
          # Match: File \"path\", line N, characters C-C:
          for m in re.finditer(r'File \"([^\"]+)\", line (\d+), characters (\d+)-\d+:\n(.*?)(?=\nFile |\Z)', log, re.DOTALL):
              f, line, col, msg = m.groups()
              msg = msg.strip().replace('\n', ' ')
              level = 'error' if 'Error' in msg else 'warning'
              print(f'::{level} file={f},line={line},col={col}::{msg}')
          "

      - name: Run tests
        # Force test actions once per CI run while retaining cached compilation
        # artifacts. QCHECK_COUNT raises property-test iteration depth.
        run: |
          opam exec -- dune runtest --force 2>&1 | tee test.log
          exit "${PIPESTATUS[0]}"
        env:
          QCHECK_COUNT: "10000"

      - name: Annotate test failures
        if: failure() && hashFiles('test.log') != ''
        run: |
          python3 -c "
          import re
          log = open('test.log').read()
          for m in re.finditer(r'File \"([^\"]+)\", line (\d+).*?:\s*(.*?FAILED.*)', log):
              f, line, msg = m.groups()
              print(f'::error file={f},line={line}::{msg.strip()}')
          for m in re.finditer(r'FAIL\s+(.+?)\s+in\s+(\S+)\s+at\s+line\s+(\d+)', log):
              name, f, line = m.groups()
              print(f'::error file={f},line={line}::Test failed: {name}')
          "

      - name: Bound Dune cache size
        if: always()
        run: opam exec -- dune cache trim --size=5GB

  format:
    name: Format Check
    runs-on: ubuntu-24.04
    env:
      DUNE_CACHE: enabled
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3.6.1
        with:
          ocaml-compiler: '5.4.1'

      # Do not cache _opam or ~/.opam: switches embed runner-specific paths.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ runner.arch }}-ocaml-5.4.1-${{ hashFiles('onton.opam') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            dune-${{ runner.os }}-${{ runner.arch }}-ocaml-5.4.1-${{ hashFiles('onton.opam') }}-${{ github.job }}-

      - name: Use opam.ocaml.org archive cache
        run: opam option 'archive-mirrors=["https://opam.ocaml.org/cache"]'

      - uses: ocaml/setup-ocaml/lint-fmt@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3.6.1

      - name: Bound Dune cache size
        if: always()
        run: opam exec -- dune cache trim --size=5GB

  worker-sandbox:
    name: Worker Sandbox (macOS)
    runs-on: macos-14
    env:
      DUNE_CACHE: enabled
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3.6.1
        with:
          ocaml-compiler: '5.4.1'

      # Do not cache _opam or ~/.opam: switches embed runner-specific paths.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ runner.arch }}-ocaml-5.4.1-${{ hashFiles('onton.opam') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            dune-${{ runner.os }}-${{ runner.arch }}-ocaml-5.4.1-${{ hashFiles('onton.opam') }}-${{ github.job }}-

      - name: Use opam.ocaml.org archive cache
        run: opam option 'archive-mirrors=["https://opam.ocaml.org/cache"]'

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      - name: Build sandbox tests and packaged executables
        run: |
          opam exec -- dune build \
            test/test_worker_sandbox_policy.exe \
            test/test_worker_sandbox_policy_properties.exe \
            test/test_worker_sandbox.exe \
            test/test_worker_backend_sandbox.exe \
            bin/main.exe \
            bin/setsid_exec/main.exe

      - name: Run real Seatbelt and backend-path tests
        env:
          ONTON_SETSID_EXEC: ${{ github.workspace }}/_build/default/bin/setsid_exec/main.exe
        run: |
          opam exec -- dune exec ./test/test_worker_sandbox_policy.exe
          opam exec -- dune exec ./test/test_worker_sandbox_policy_properties.exe
          opam exec -- dune exec ./test/test_worker_sandbox.exe
          opam exec -- dune exec ./test/test_worker_backend_sandbox.exe

      - name: Verify release package layout
        run: |
          mkdir -p _dist/bin
          cp _build/default/bin/main.exe _dist/bin/onton
          cp _build/default/bin/setsid_exec/main.exe _dist/bin/onton-setsid-exec
          chmod +x _dist/bin/onton _dist/bin/onton-setsid-exec
          tar czf /tmp/onton-package-test.tar.gz -C _dist/bin onton onton-setsid-exec
          test "$(tar tzf /tmp/onton-package-test.tar.gz | sort | tr '\n' ' ')" = "onton onton-setsid-exec "
          _dist/bin/onton --version

      - name: Bound Dune cache size
        if: always()
        run: opam exec -- dune cache trim --size=5GB

  shell-lint:
    name: Shell Lint & Format
    runs-on: ubuntu-24.04
    env:
      SHFMT_VERSION: v3.13.1
      # 2-space indent + case-item indent matches the existing scripts/ style.
      SHFMT_FLAGS: "-i 2 -ci"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Discover shell scripts
        id: discover
        # Match by extension *and* by shebang so files like git hooks or
        # scripts without a `.sh` suffix still get checked. `git ls-files -z`
        # respects .gitignore and avoids globbing surprises.
        run: |
          set -euo pipefail
          # `if … fi` (not `&&`) so a non-matching grep doesn't fail the
          # subshell under `set -e` and abort the whole pipeline.
          {
            git ls-files -z '*.sh' '*.bash'
            git ls-files -z | while IFS= read -r -d '' f; do
              [ -f "$f" ] || continue
              case "$f" in *.sh|*.bash) continue ;; esac
              # Only read the first line; skip binaries and large files cheaply.
              if head -c 128 -- "$f" 2>/dev/null | head -n 1 \
                  | grep -Eq '^#![[:space:]]*((/usr/bin/env[[:space:]]+)?|/usr/bin/|/bin/)(bash|dash|ksh|sh)([[:space:]]|$)'; then
                printf '%s\0' "$f"
              fi
            done
          } | sort -zu | tee "$RUNNER_TEMP/shell-files.nul" >/dev/null
          count=$(tr -cd '\0' < "$RUNNER_TEMP/shell-files.nul" | wc -c | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Discovered $count shell script(s):"
          tr '\0' '\n' < "$RUNNER_TEMP/shell-files.nul"

      - name: Install shfmt
        if: steps.discover.outputs.count != '0'
        # Checksums pin the exact binary for SHFMT_VERSION; bumping the version
        # requires regenerating both. Computed via:
        #   sha256sum shfmt_v3.13.1_linux_{amd64,arm64}
        env:
          SHFMT_SHA256_LINUX_AMD64: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
          SHFMT_SHA256_LINUX_ARM64: 32d92acaa5cd8abb29fc49dac123dc412442d5713967819d8af2c29f1b3857c7
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "$arch" in
            x86_64)  shfmt_arch="linux_amd64"; expected_sha="$SHFMT_SHA256_LINUX_AMD64" ;;
            aarch64) shfmt_arch="linux_arm64"; expected_sha="$SHFMT_SHA256_LINUX_ARM64" ;;
            *) echo "Unsupported architecture: $arch" >&2; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/shfmt" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_${shfmt_arch}"
          echo "${expected_sha}  ${RUNNER_TEMP}/shfmt" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/shfmt"
          sudo mv "$RUNNER_TEMP/shfmt" /usr/local/bin/shfmt
          shfmt --version

      - name: shellcheck
        if: steps.discover.outputs.count != '0'
        run: |
          set -euo pipefail
          shellcheck --version
          xargs -0 shellcheck < "$RUNNER_TEMP/shell-files.nul"

      - name: shfmt --diff
        if: steps.discover.outputs.count != '0'
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # SHFMT_FLAGS intentionally word-splits
          xargs -0 shfmt $SHFMT_FLAGS -d < "$RUNNER_TEMP/shell-files.nul"

  lint-yojson:
    name: No raw Yojson.Safe.Util
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Guards against new partial-accessor (member/to_string/to_*) call sites
      # creeping back in outside lib_core/json.ml. See the script header and
      # scripts/yojson-util-allowlist.txt.
      - name: check-no-raw-yojson
        run: bash scripts/check-no-raw-yojson.sh

  archlint:
    name: Archlint
    runs-on: ubuntu-24.04
    env:
      DUNE_CACHE: enabled
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Cache only relocatable Dune artifacts, never _opam or ~/.opam. The
      # broader second prefix lets this Linux consumer reuse a compatible
      # prior-run cache produced by another job before saving its own key.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/dune
          key: dune-${{ runner.os }}-${{ runner.arch }}-ocaml-5.4.1-${{ hashFiles('onton.opam') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            dune-${{ runner.os }}-${{ runner.arch }}-ocaml-5.4.1-${{ hashFiles('onton.opam') }}-${{ github.job }}-
            dune-${{ runner.os }}-${{ runner.arch }}-ocaml-5.4.1-${{ hashFiles('onton.opam') }}-

      # The Archlint OCaml adapter reads the consumer's typedtree artifacts;
      # its composite action installs dependencies but does not build them.
      - uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3.6.1
        with:
          ocaml-compiler: '5.4.1'

      - name: Install dependencies for Archlint
        run: opam install . --deps-only --with-test -y

      - name: Build typedtree artifacts for Archlint
        run: opam exec -- dune build

      # Architecture conformance, enforced from the standalone archlint suite.
      # The composite action checks archlint out into its own action path; only
      # its OCaml adapter runs, against the typedtrees prepared from our source
      # root above.
      - uses: flowglad/archlint@v1
        with:
          adapter: ocaml
          ocaml-root: .

      - name: Bound Dune cache size
        if: always()
        run: opam exec -- dune cache trim --size=5GB
